name: Desplegar GESTOCK en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend_gestock/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend_gestock
        run: npm ci

      - name: Compilar la pagina
        working-directory: frontend_gestock
        run: npm run build -- --output-path dist/gestock --base-href=/gestock-app/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto estatico
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend_gestock/dist/gestock/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4