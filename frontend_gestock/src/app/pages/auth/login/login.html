<div class="login-card" [class.shake-anim]="shakeAnimacion">
  <button type="button" class="btn-back" routerLink="/" (click)="irAlInicio()">← Volver al inicio</button>

  <div class="brand-badge">
    <span class="brand-icon"><i class="fas fa-boxes-stacked"></i></span> Gestock
  </div>

  <h2>Iniciar Sesión</h2>
  <p class="subtitle">Ingresa tus datos para acceder al sistema de gestión.</p>

  <form [formGroup]="loginForm" (ngSubmit)="procesarLogin()" novalidate>
    <div class="form-group">
      <label>Correo Electrónico</label>
      <div class="input-wrapper">
        <span class="icon"><i class="fas fa-envelope"></i></span>
        <input
          type="email"
          formControlName="email"
          placeholder="correo@ejemplo.com"
          autocomplete="email"
          [class.input-error]="emailInvalid" />
      </div>
      <span *ngIf="emailInvalid" class="field-error">{{ mensajeEmailError }}</span>
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <div class="input-wrapper">
        <span class="icon"><i class="fas fa-lock"></i></span>
        <input
          [type]="mostrarPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
          [class.input-error]="passwordInvalid" />
        <button type="button" class="toggle-password" (click)="mostrarPassword = !mostrarPassword" [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          <i [class]="mostrarPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
        </button>
      </div>
      <span *ngIf="passwordInvalid" class="field-error">{{ mensajePasswordError }}</span>
    </div>

    <div class="form-options">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="recordar" /> Recordar este dispositivo
      </label>
      <a routerLink="/auth/recuperar-contrasena" class="forgot-link">¿Olvidaste tu contraseña?</a>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      <i class="fas fa-exclamation-circle"></i>
      <span>{{ errorMessage }}</span>
      <a routerLink="/auth/recuperar-contrasena" class="error-recovery-link">¿Restablecer contraseña?</a>
    </div>

    <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || enviando">
      <i *ngIf="enviando" class="fas fa-circle-notch fa-spin"></i>
      <span>{{ enviando ? 'Ingresando...' : 'Acceder a la Plataforma' }}</span>
      <i *ngIf="!enviando" class="fas fa-arrow-right btn-submit-arrow"></i>
    </button>
  </form>
</div>
