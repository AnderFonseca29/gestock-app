<aside class="app-sidebar">

    <span class="brand-icon"><i class="fas fa-boxes-stacked"></i></span>
    <span class="brand-title">Gestock</span>

    <ng-container *ngIf="tieneItemsVisibles('PANEL')">
      <div class="nav-section-title">PANEL</div>
      <ng-container *ngFor="let item of menuItems">
        <a *ngIf="item.section === 'PANEL' && esPermitido(item.permisos)" 
           [routerLink]="item.route" 
           routerLinkActive="active" 
           class="nav-item">
          <span class="nav-icon"><i [class]="item.icon"></i></span>
          <span class="nav-text">{{ item.label }}</span>
        </a>
      </ng-container>
    </ng-container>
